        // 顯示會員資訊
        function displayMemberInfo(member) {
            selectedMember = member;
            
            // 顯示會員資訊卡
            document.getElementById('memberIdDisplay').textContent = member.id;
            document.getElementById('memberName').textContent = member.name;
            document.getElementById('memberGender').textContent = member.gender === 'male' ? '男' : '女';
            
            // 計算年齡並顯示生日
            if (member.birthday) {
                const birthDate = new Date(member.birthday);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const monthDiff = today.getMonth() - birthDate.getMonth();
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                // 格式化生日顯示：YYYY/MM/DD (年齡歲)
                const year = birthDate.getFullYear();
                const month = (birthDate.getMonth() + 1).toString().padStart(2, '0');
                const day = birthDate.getDate().toString().padStart(2, '0');
                document.getElementById('memberBirthday').textContent = `${year}/${month}/${day} (${age}歲)`;
            } else {
                document.getElementById('memberBirthday').textContent = '-';
            }
            
            // 疾病史
            const diseaseAlert = document.getElementById('memberDiseaseAlert');
            if (member.disease_history && member.disease_history !== '無' && member.disease_history.trim() !== '') {
                document.getElementById('memberDisease').textContent = member.disease_history;
                diseaseAlert.style.display = 'block';
            } else {
                diseaseAlert.style.display = 'none';
            }
            
            document.getElementById('memberInfoCard').classList.add('show');
        }

        function renderMotiTimeline(data) {
            const container = document.getElementById('motiTimelineContent');

                const formattedDate = `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')}`;
                const isLatest = index === 0;
                const detailHtml = generateMotiDetailHtml(item);

                const summaryText = item.risk_1 ?

                return `
                    <div class="moti-timeline-item" data-index="${index}">

            const imageHtml = firstImageUrl ? `

                    <div class="moti-detail-title">⚠️ 風險排名</div>
                    <div class="moti-muscle-tags">${risksHtml}</div>

                    <div class="moti-notes">${item.functional_training}</div>
                </div>

                ${item.fascia_release ? `
                <div class="moti-detail-section">

                    <div class="moti-notes">${item.fascia_release}</div>

        function toggleMotiDetail(index, type) {
            const container = type === 'moti' ? 
                document.getElementById('motiTimelineContent') : 
                document.getElementById('inbodyTimelineContent');
            
            const items = container.querySelectorAll('.moti-timeline-item');
            const targetItem = container.querySelector(`.moti-timeline-item[data-index="${index}"]`);
            
            if (targetItem.classList.contains('active')) {
                targetItem.classList.remove('active');
            } else {
                items.forEach(item => item.classList.remove('active'));
                targetItem.classList.add('active');
            }
        }

                    <div class="exercise-grid">

                            <label class="form-label">動作名稱</label>
                            <input type="text" class="form-input" placeholder="例：Footwork" data-field="name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">器材</label>
                            <select class="form-select" data-field="equipment" onchange="toggleEquipmentOther(this, '${exerciseId}')">
                                <option value="">選擇器材</option>
                                ${PILATES_EQUIPMENT.map(e => `<option value="${e}">${e}</option>`).join('')}
                            </select>
                            <input type="text" class="form-input equipment-other-input" id="${exerciseId}_equipment_other" placeholder="請輸入其他器材..." data-field="equipmentOther">
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: var(--spacing-sm);">
                        <label class="form-label">其它輔具（多選）</label>
                        <div class="accessories-grid">${accessoriesHtml}</div>
                        <div class="conditional-field" id="${exerciseId}_acc_other_field">
                            <input type="text" class="form-input" placeholder="請輸入其他輔具..." data-field="accessoryOther">
                        </div>
                    </div>
                    
                    <div class="sub-title" style="margin-top: var(--spacing-md);">組數紀錄</div>
                    <div class="sets-container" id="${exerciseId}_sets"></div>
                    <button type="button" class="add-btn" style="margin-top: var(--spacing-sm);" onclick="addPilatesSet('${exerciseId}')">
                        <span>+</span> 新增一組
                    </button>
                    
                    <div class="form-group" style="margin-top: var(--spacing-md);">
                        <label class="form-label">備註</label>
                        <input type="text" class="form-input" placeholder="補充說明..." data-field="notes">
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', exerciseHtml);
            
            // 綁定啞鈴勾選時啟用重量輸入
            const dumbbellIdx = PILATES_ACCESSORIES.indexOf('啞鈴');
            const dumbbellCheckbox = document.getElementById(`${exerciseId}_acc_${dumbbellIdx}`);
            if (dumbbellCheckbox) {
                dumbbellCheckbox.addEventListener('change', function() {
                    const weightInput = document.getElementById(`${exerciseId}_dumbbell_weight`);
                    if (weightInput) {
                        weightInput.disabled = !this.checked;
                        if (!this.checked) weightInput.value = '';
                    }
                });
            }
            
            // 綁定「其他」輔具的顯示邏輯
            const otherIdx = PILATES_ACCESSORIES.indexOf('其他');
            const otherCheckbox = document.getElementById(`${exerciseId}_acc_${otherIdx}`);
            if (otherCheckbox) {
                otherCheckbox.addEventListener('change', function() {
                    document.getElementById(`${exerciseId}_acc_other_field`).classList.toggle('show', this.checked);
                });
            }
            
            addPilatesSet(exerciseId);
        }
        
        function addPilatesSet(exerciseId) {
            const container = document.getElementById(`${exerciseId}_sets`);
            const setNumber = container.children.length + 1;
            const setId = `${exerciseId}_set_${setNumber}`;
            
            const setHtml = `
                <div class="set-item" id="${setId}">
                    <div class="set-number">第${setNumber}組</div>
                    <div class="set-inputs">
                        <div class="set-input-group">
                            <label>彈簧顏色</label>
                            <select data-field="spring">
                                <option value="">選擇</option>
                                <option value="黃">黃</option>
                                <option value="綠">綠</option>
                                <option value="紅">紅</option>
                            </select>
                        </div>
                        <div class="set-input-group">
                            <label>次數</label>
                            <input type="number" placeholder="0" data-field="reps">
                        </div>
                        <div class="set-input-group">
                            <label>動作品質</label>
                            <div class="star-rating-mini" data-field="quality" data-max="5">
                                <input type="hidden" data-field="quality-value" value="">
                                <span class="star" data-value="1"></span>
                                <span class="star" data-value="2"></span>
                                <span class="star" data-value="3"></span>
                                <span class="star" data-value="4"></span>
                                <span class="star" data-value="5"></span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="set-delete" onclick="deleteSet('${setId}')">✕</button>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', setHtml);
            
            // 初始化新添加的星星評分
            const newSet = document.getElementById(setId);
            initStarRating(newSet.querySelector('.star-rating-mini'));
        }
        
        function deletePilatesExercise(exerciseId) {
            document.getElementById(exerciseId)?.remove();
            renumberPilatesExercises();
        }
        
        function renumberPilatesExercises() {
            const exercises = document.querySelectorAll('#pilatesExerciseList .exercise-item');
            exercises.forEach((exercise, index) => {
                exercise.querySelector('.exercise-number').textContent = index + 1;
            });
            pilatesExerciseCount = exercises.length;
        }
        
        // 通用：刪除組數
        function deleteSet(setId) {
            const setElement = document.getElementById(setId);
            const container = setElement?.parentElement;
            setElement?.remove();
            
            // 重新編號
            if (container) {
                const sets = container.querySelectorAll('.set-item');
                sets.forEach((set, index) => {
                    set.querySelector('.set-number').textContent = `第${index + 1}組`;
                });
            }
        }
        
        // 切換器材其他輸入框
        function toggleEquipmentOther(selectElement, exerciseId) {
            const otherInput = document.getElementById(`${exerciseId}_equipment_other`);
            if (otherInput) {
                otherInput.classList.toggle('show', selectElement.value === '其他');
                if (selectElement.value !== '其他') {
                    otherInput.value = '';
                }
            }
        }
        
        // ============================================
        // 資料收集與提交
        // ============================================
        function collectFormData() {
            const data = {
                // 基本資訊
                coachId: currentCoach?.id,
                coachName: currentCoach?.name,
                memberId: selectedMember?.id,
                memberName: selectedMember?.name,
                classDate: document.getElementById('classDate').value,
                classTime: document.getElementById('classTime').value,
                classType: coachClassType,
                trainingPurpose: document.getElementById('trainingPurpose').value,
                
                // 學員當日狀況
                isLate: document.querySelector('input[name="isLate"]:checked')?.value === 'yes',
                mentalStateRating: document.querySelector('input[name="mentalState"]')?.value || null,
                incidentTypes: getCheckedValues(['incident_none', 'incident_dizzy', 'incident_nausea', 'incident_vomit', 'incident_injury']),
                needAdminFollowup: document.querySelector('input[name="needAdminFollowup"]:checked')?.value === 'yes',
                adminFollowupNotes: document.getElementById('adminFollowupText').value,
                
                // 訓練內容（根據課種不同）
                trainingDetails: null
            };
            
            // 根據課種收集訓練內容
            switch (coachClassType) {
                case 'strength_training':
                    data.trainingDetails = collectWeightTrainingData();
                    break;
                case 'pilates':
                    data.trainingDetails = collectPilatesTrainingData();
                    break;
                case 'stretching':
                    data.trainingDetails = collectStretchData();
                    break;
            }
            
            return data;
        }
        
        function collectWeightTrainingData() {
            const exercises = [];
            document.querySelectorAll('#weightExerciseList .exercise-item').forEach(exercise => {
                const sets = [];
                exercise.querySelectorAll('.set-item').forEach(set => {
                    const qualityInput = set.querySelector('.star-rating-mini input[type="hidden"]');
                    sets.push({
                        weight: set.querySelector('[data-field="weight"]').value,
                        reps: set.querySelector('[data-field="reps"]').value,
                        quality: qualityInput ? qualityInput.value : ''
                    });
                });
                
                let equipment = exercise.querySelector('[data-field="equipment"]').value;
                if (equipment === '其他') {
                    const otherInput = exercise.querySelector('[data-field="equipmentOther"]');
                    equipment = otherInput ? otherInput.value : '其他';
                }
                
                exercises.push({
                    name: exercise.querySelector('[data-field="name"]').value,
                    equipment: equipment,
                    sets: sets
                });
            });
            return { exercises };
        }
        
        function collectPilatesTrainingData() {
            const exercises = [];
            document.querySelectorAll('#pilatesExerciseList .exercise-item').forEach(exercise => {
                const exerciseId = exercise.id;
                const accessories = [];
                
                // 收集所有輔具（包含啞鈴）
                exercise.querySelectorAll('.accessories-grid .accessory-item input[type="checkbox"]:checked').forEach(checkbox => {
                    if (checkbox.value === '啞鈴') {
                        // 啞鈴特殊處理，加上重量
                        const weightInput = document.getElementById(`${exerciseId}_dumbbell_weight`);
                        const weight = weightInput ? weightInput.value : '';
                        accessories.push(weight ? `啞鈴(${weight}kg)` : '啞鈴');
                    } else {
                        accessories.push(checkbox.value);
                    }
                });
                
                const accessoryOtherInput = exercise.querySelector('[data-field="accessoryOther"]');
                if (accessories.includes('其他') && accessoryOtherInput?.value) {
                    const idx = accessories.indexOf('其他');
                    accessories.splice(idx, 1);
                    accessories.push(accessoryOtherInput.value);
                }
                
                const sets = [];
                exercise.querySelectorAll('.set-item').forEach(set => {
                    const qualityInput = set.querySelector('.star-rating-mini input[type="hidden"]');
                    sets.push({
                        spring: set.querySelector('[data-field="spring"]').value,
                        reps: set.querySelector('[data-field="reps"]').value,
                        quality: qualityInput ? qualityInput.value : ''
                    });
                });
                
                let equipment = exercise.querySelector('[data-field="equipment"]').value;
                if (equipment === '其他') {
                    const otherInput = exercise.querySelector('[data-field="equipmentOther"]');
                    equipment = otherInput ? otherInput.value : '其他';
                }
                
                exercises.push({
                    name: exercise.querySelector('[data-field="name"]').value,
                    equipment: equipment,
                    accessories: accessories,
                    sets: sets,
                    notes: exercise.querySelector('[data-field="notes"]').value
                });
            });
            return { exercises };
        }
        
        function collectStretchData() {
            // 課程長度
            const durationBtn = document.querySelector('.duration-btn.active');
            const duration = durationBtn ? durationBtn.dataset.duration : null;
            
            // 主訴
            let mainComplaint = document.querySelector('input[name="mainComplaint"]:checked')?.value;
            if (mainComplaint === 'other') {
                mainComplaint = document.getElementById('mainComplaintOtherText').value;
            }
            
            // 延伸部位
            const extendedAreas = [];
            document.querySelectorAll('#extendedAreasGroup input:checked').forEach(checkbox => {
                if (checkbox.value === 'other') {
                    const otherText = document.getElementById('extendedAreasOtherText').value;
                    if (otherText) extendedAreas.push(otherText);
                } else {
                    extendedAreas.push(checkbox.value);
                }
            });
            
            // 輔具
            const tools = [];
            ['tool_oil', 'tool_scraper', 'tool_cupping', 'tool_other'].forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox.checked) {
                    if (checkbox.value === 'other') {
                        const otherText = document.getElementById('stretchToolOtherText').value;
                        if (otherText) tools.push(otherText);
                    } else {
                        tools.push(checkbox.value);
                    }
                }
            });
            
            // 進步星數
            const progressRating = document.querySelector('input[name="progressRating"]')?.value;
            
            // 回家作業
            const homework = [];
            document.querySelectorAll('.homework-item input:checked').forEach(checkbox => {
                if (checkbox.value === 'other') {
                    const otherText = document.getElementById('homeworkOtherText').value;
                    if (otherText) homework.push(otherText);
                } else {
                    homework.push(checkbox.value);
                }
            });
            
            return {
                duration: duration,
                mainComplaint: mainComplaint,
                extendedAreas: extendedAreas,
                tools: tools,
                progressRating: progressRating,
                homework: homework
            };
        }
        
        function getCheckedValues(ids) {
            const values = [];
            ids.forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox?.checked) {
                    values.push(checkbox.value);
                }
            });
            return values;
        }
        
        // 驗證表單
        function validateForm() {
            if (!selectedMember) {
                showToast('請選擇學員', 'error');
                return false;
            }
            
            if (!document.getElementById('classDate').value) {
                showToast('請選擇課程日期', 'error');
                return false;
            }
            
            if (!document.getElementById('classTime').value) {
                showToast('請選擇課程時間', 'error');
                return false;
            }
            
            if (!coachClassType) {
                showToast('課程類型設定錯誤', 'error');
                return false;
            }
            
            // 檢查課間狀況是否有勾選
            const incidentChecked = document.querySelector('#incident_none:checked, #incident_dizzy:checked, #incident_nausea:checked, #incident_vomit:checked, #incident_injury:checked');
            if (!incidentChecked) {
                showToast('請選擇課間狀況', 'error');
                return false;
            }
            
            // 檢查行政關心選「是」時必須填寫說明
            const needAdmin = document.querySelector('input[name="needAdminFollowup"]:checked')?.value === 'yes';
            if (needAdmin && !document.getElementById('adminFollowupText').value.trim()) {
                showToast('請填寫需通知行政的詳細情況', 'error');
                return false;
            }
            
            // 伸展課程額外驗證
            if (coachClassType === 'stretching') {
                if (!document.querySelector('.duration-btn.active')) {
                    showToast('請選擇課程長度', 'error');
                    return false;
                }
                if (!document.querySelector('input[name="mainComplaint"]:checked')) {
                    showToast('請選擇當堂課程主訴', 'error');
                    return false;
                }
            }
            
            return true;
        }
        
        // 提交表單
        async function submitForm() {
            if (!validateForm()) return;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            
            try {
                const formData = collectFormData();
                console.log('提交資料:', formData);
                
                if (CONFIG.DEBUG_MODE) {
                    // Debug 模式：模擬成功
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    showToast('課表紀錄已成功提交！', 'success');
                } else {
                    const response = await fetch(CONFIG.WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'submitClassRecord',
                            data: formData
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        showToast('課表紀錄已成功提交！', 'success');
                        
                        // 可選：關閉 LIFF
                        // if (liff.isInClient()) liff.closeWindow();
                    } else {
                        throw new Error(result.message || '提交失敗');
                    }
                }
                
            } catch (error) {
                console.error('提交失敗:', error);
                showToast('提交失敗，請稍後再試', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '送出紀錄';
            }
        }
        
        // 重置表單
        function resetForm() {
            if (!confirm('確定要清除所有已填寫的內容嗎？')) return;
            
            // 重置會員選擇
            clearSelectedMember();
            
            // 重置訓練目的
            document.getElementById('trainingPurpose').value = '';
            
            // 重置重訓區塊
            document.getElementById('weightExerciseList').innerHTML = '';
            weightExerciseCount = 0;
            if (coachClassType === 'strength_training') addWeightExercise();
            
            // 重置皮拉提斯區塊
            document.getElementById('pilatesExerciseList').innerHTML = '';
            pilatesExerciseCount = 0;
            if (coachClassType === 'pilates') addPilatesExercise();
            
            // 重置伸展區塊
            document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('input[name="mainComplaint"]').forEach(radio => radio.checked = false);
            document.querySelectorAll('#extendedAreasGroup input').forEach(checkbox => checkbox.checked = false);
            document.querySelectorAll('.homework-item input').forEach(checkbox => checkbox.checked = false);
            // 重置進步星數
            const progressInput = document.querySelector('input[name="progressRating"]');
            if (progressInput) {
                progressInput.value = '';
                updateStarDisplay(progressInput.closest('.star-rating'), 0);
            }
            ['tool_oil', 'tool_scraper', 'tool_cupping', 'tool_other'].forEach(id => {
                document.getElementById(id).checked = false;
            });
            // 重置其他欄位文字輸入
            document.getElementById('mainComplaintOtherText') && (document.getElementById('mainComplaintOtherText').value = '');
            document.getElementById('extendedAreasOtherText') && (document.getElementById('extendedAreasOtherText').value = '');
            document.getElementById('stretchToolOtherText') && (document.getElementById('stretchToolOtherText').value = '');
            document.getElementById('homeworkOtherText') && (document.getElementById('homeworkOtherText').value = '');
            // 隱藏其他欄位
            document.getElementById('mainComplaintOther')?.classList.remove('show');
            document.getElementById('extendedAreasOther')?.classList.remove('show');
            document.getElementById('stretchToolOther')?.classList.remove('show');
            document.getElementById('homeworkOther')?.classList.remove('show');
            
            // 重置學員狀況
            document.getElementById('isLate_no').checked = true;
            // 重置精神狀態星數
            const mentalInput = document.querySelector('input[name="mentalState"]');
            if (mentalInput) {
                mentalInput.value = '';
                updateStarDisplay(mentalInput.closest('.star-rating'), 0);
            }
            document.querySelectorAll('#incident_none, #incident_dizzy, #incident_nausea, #incident_vomit, #incident_injury').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.getElementById('adminFollowup_no').checked = true;
            document.getElementById('adminFollowupText').value = '';
            document.getElementById('adminFollowupNotes').classList.remove('show');
            
            // 重設日期時間為當前
            setCurrentDate();
            
            // 重置條件欄位
            document.querySelectorAll('.conditional-field').forEach(field => field.classList.remove('show'));
            
            showToast('表單已清除', 'success');
        }
        
        // Toast 提示
        // ============================================
        // 星星評分系統（支持半星）
        // ============================================
        function initStarRating(container) {
            const stars = container.querySelectorAll('.star');
            const hiddenInput = container.querySelector('input[type="hidden"]');
            
            stars.forEach(star => {
                star.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const width = rect.width;
                    const starValue = parseInt(this.dataset.value);
                    
                    // 點左半邊 = 半星，點右半邊 = 全星
                    let rating;
                    if (x < width / 2) {
                        rating = starValue - 0.5;
                    } else {
                        rating = starValue;
                    }
                    
                    // 更新隱藏輸入
                    if (hiddenInput) {
                        hiddenInput.value = rating;
                    }
                    
                    // 更新視覺顯示
                    updateStarDisplay(container, rating);
                });
                
                // hover 效果
                star.addEventListener('mousemove', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const width = rect.width;
                    const starValue = parseInt(this.dataset.value);
                    
                    let hoverRating;
                    if (x < width / 2) {
                        hoverRating = starValue - 0.5;
                    } else {
                        hoverRating = starValue;
                    }
                    
                    updateStarDisplay(container, hoverRating, true);
                });
            });
            
            container.addEventListener('mouseleave', function() {
                const currentValue = hiddenInput ? parseFloat(hiddenInput.value) || 0 : 0;
                updateStarDisplay(container, currentValue);
            });
        }
        
        function updateStarDisplay(container, rating, isHover = false) {
            const stars = container.querySelectorAll('.star');
            
            stars.forEach(star => {
                const starValue = parseInt(star.dataset.value);
                star.classList.remove('full', 'half');
                
                if (starValue <= Math.floor(rating)) {
                    star.classList.add('full');
                } else if (starValue === Math.ceil(rating) && rating % 1 !== 0) {
                    star.classList.add('half');
                }
            });
        }
        
        function initAllStarRatings() {
            document.querySelectorAll('.star-rating, .star-rating-mini').forEach(container => {
                initStarRating(container);
            });
        }
        
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
